name: go-lint

on:
    push:
        branches: ["master"]
    pull_request:
        branches: ["master"]

permissions:
    contents: read

jobs:
    lint:
        name: "lint ${{ github.ref }}"
        runs-on: ubuntu-slim
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-go@v7
              with:
                  go-version-file: "go.mod"
                  cache: true

            - uses: golangci/golangci-lint-action@v9
              with:
                  version: "latest"
